name: Harga PG Jewel & Buyback -> Telegram

on:
  schedule:
    # Minit ke-16, 36 & 56 setiap jam (minit sama dalam UTC & waktu Malaysia).
    # Update harian 12:16 pagi MYT (= 16:16 UTC) dikendalikan dalam bot.py.
    - cron: "16,36,56 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / force / daily"
        default: normal

permissions:
  contents: write

concurrency:
  group: harga-jewel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Semak harga & hantar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHANNEL_ID }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: |
          ARGS=""
          [ "$MODE" = "force" ] && ARGS="--force"
          [ "$MODE" = "daily" ] && ARGS="--daily"
          python bot.py $ARGS

      - name: Simpan state harga
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "harga-jewel-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "Kemas kini state harga jewel [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
